services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_PATH: /data/data.db
    volumes:
      - db_data:/data
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  db_data:
